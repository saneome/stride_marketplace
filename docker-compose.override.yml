version: '3.9'

services:
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend/app:/app/app
    environment:
      - DEBUG=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend-public:
    build:
      context: ./frontend-public
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./frontend-public/src:/app/src
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost
    command: npm run dev -- --host 0.0.0.0

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./admin-frontend/src:/app/src
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
