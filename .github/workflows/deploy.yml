name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/marketplace-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/marketplace-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/marketplace-backend:buildcache,mode=max
      
      - name: Build and push frontend-public
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-public
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/marketplace-frontend-public:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/marketplace-frontend-public:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/marketplace-frontend-public:buildcache,mode=max
      
      - name: Build and push admin-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./admin-frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/marketplace-admin-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/marketplace-admin-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/marketplace-admin-frontend:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/marketplace
            docker-compose pull
            docker-compose up -d
            docker system prune -f
